{% extends "layout.html" %}
{% block title %}Эрдмийн зэрэг{% endblock %}
{% block content %}
<h2 class="text-center">{{ "Эрдмийн зэрэг нэмэх" if mode=="add" else "Эрдмийн зэрэг засах" }}</h2>

<form method="post" class="mt-3" style="max-width:520px;margin:0 auto;">
  <div class="mb-2">
    <label class="form-label">Нэр</label>
    <input name="ner" class="form-control" required value="{{ row.ner if row else '' }}">
  </div>
  <button class="btn btn-primary">{{ "Нэмэх" if mode=="add" else "Хадгалах" }}</button>
  <a class="btn btn-outline-secondary" href="{{ url_for('zereg_list') }}">Буцах</a>
</form>
{% endblock %}
