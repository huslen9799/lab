<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}MU{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    body{ background:#ffffff; }
    .topbar{ background:#2f343b; }
    .topbar .nav-link{ color:#cfd4da; font-size:13px; padding:.75rem .8rem; }
    .topbar .nav-link:hover{ color:#fff; }
    .page-wrap{ background:#e9ecef; padding:22px 0; }
    .panel{ background:#eef1f4; border:1px solid #d6d9dd; padding:26px 28px; }
    .panel h2{ font-size:22px; margin:0 0 6px; font-weight:700; }
    .subline{ font-weight:700; margin:10px 0 6px; }
    .table thead th{ background:#343a40!important; color:#fff!important; border-color:#343a40!important; font-size:12px; padding:10px 12px; }
    .table tbody td{ background:#fff; font-size:12px; padding:10px 12px; }
    .link-add{ font-size:12px; color:#0d6efd; text-decoration:none; }
    .link-add:hover{ text-decoration:underline; }
    .action a{ color:#0d6efd; margin-left:8px; }
    .action a:hover{ color:#0a58ca; }
    .avatar{ width:22px; height:22px; border-radius:2px; object-fit:cover; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand topbar">
  <div class="container">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" href="/">Нүүр</a></li>
      <li class="nav-item"><a class="nav-link" href="/alban">Албан тушаал</a></li>
      <li class="nav-item"><a class="nav-link" href="/zereg">Эрдмийн зэрэг</a></li>
      <li class="nav-item"><a class="nav-link" href="/tenhim">Тэнхим</a></li>
      <li class="nav-item"><a class="nav-link" href="/bagsh">Багш</a></li>
      <li class="nav-item"><a class="nav-link" href="/oyutan">Оюутан</a></li>
    </ul>
  </div>
</nav>

<div class="page-wrap">
  <div class="container">
    <div class="panel">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, msg in messages %}
            <div class="alert alert-{{ category }} mb-3">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
