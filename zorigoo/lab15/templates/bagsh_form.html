{% extends "layout.html" %}
{% block title %}Багш{% endblock %}
{% block content %}
<h2 class="text-center">{{ "Багш нэмэх" if mode=="add" else "Багш засах" }}</h2>

<form method="post" class="mt-3" style="max-width:900px;margin:0 auto;">
  <div class="row g-2">
    <div class="col-md-3">
      <label class="form-label">Код</label>
      <input name="code" class="form-control" required value="{{ row.code if row else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">Овог</label>
      <input name="ovog" class="form-control" required value="{{ row.ovog if row else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">Нэр</label>
      <input name="ner" class="form-control" required value="{{ row.ner if row else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label d-block">Хүйс</label>
      {% set h = (row.huis if row else 'Эр') %}
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="huis" value="Эр" {{ 'checked' if h=='Эр' else '' }}>
        <label class="form-check-label">Эр</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="huis" value="Эм" {{ 'checked' if h=='Эм' else '' }}>
        <label class="form-check-label">Эм</label>
      </div>
    </div>

    <div class="col-md-3">
      <label class="form-label">Ажилд орсон</label>
      <input type="date" name="ajild_orson" class="form-control" required value="{{ row.ajild_orson if row else '' }}">
    </div>

    <div class="col-md-3">
      <label class="form-label">Тэнхим</label>
      <select name="tenhim_id" class="form-select" required>
        {% for t in tenhim %}
          <option value="{{ t.id }}" {{ 'selected' if row and row.tenhim_id==t.id else '' }}>{{ t.ner }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Албан тушаал</label>
      <select name="alban_tushaal_id" class="form-select" required>
        {% for a in alban %}
          <option value="{{ a.id }}" {{ 'selected' if row and row.alban_tushaal_id==a.id else '' }}>{{ a.ner }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-3">
      <label class="form-label">Эрдмийн зэрэг</label>
      <select name="erdmiin_zereg_id" class="form-select" required>
        {% for z in zereg %}
          <option value="{{ z.id }}" {{ 'selected' if row and row.erdmiin_zereg_id==z.id else '' }}>{{ z.ner }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="mt-3">
    <button class="btn btn-primary">{{ "Нэмэх" if mode=="add" else "Хадгалах" }}</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('bagsh_list') }}">Буцах</a>
  </div>
</form>
{% endblock %}
