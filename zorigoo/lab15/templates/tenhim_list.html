{% extends "layout.html" %}
{% block title %}Тэнхим{% endblock %}
{% block content %}
<h2 class="text-center">Тэнхим</h2>
<a class="link-add" href="{{ url_for('tenhim_add') }}">Шинээр нэмэх</a>
<div class="subline">Жагсаалт</div>

<table class="table table-bordered align-middle mt-2">
  <thead><tr><th style="width:80px;">ID</th><th>Нэр</th><th style="width:110px;">Үйлдэл</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td>{{ r.id }}</td>
      <td>{{ r.ner }}</td>
      <td class="action text-center">
        <a href="{{ url_for('tenhim_edit', id=r.id) }}"><i class="fa-solid fa-pen-to-square"></i></a>
        <a href="{{ url_for('tenhim_delete', id=r.id) }}" onclick="return confirm('Устгах уу?')"><i class="fa-solid fa-trash"></i></a>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="3" class="text-center text-muted">Мэдээлэл алга</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
