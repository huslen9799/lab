

{% extends "layout.html" %}
{% block content %}
<div class="bg-white rounded shadow-sm p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Албан тушаал</h4>
    <a class="btn btn-primary btn-sm" href="{{ url_for('alban_add') }}">
      <i class="fa fa-plus"></i> Нэмэх
    </a>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th style="width:80px">#</th>
        <th>Албан тушаал</th>
        <th style="width:120px">Үйлдэл</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.id }}</td>
        <td>{{ r.name }}</td>
        <td class="text-center">
          <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('alban_edit', id=r.id) }}">
            <i class="fa fa-pen"></i>
          </a>

          <form action="{{ url_for('alban_delete', id=r.id) }}" method="POST" class="d-inline"
                onsubmit="return confirm('Устгах уу?');">
            <button class="btn btn-outline-danger btn-sm" type="submit">
              <i class="fa fa-trash"></i>
            </button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
