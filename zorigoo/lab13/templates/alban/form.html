{% extends "layout.html" %}
{% block content %}
<div class="bg-white rounded shadow-sm p-4" style="max-width:520px;">
  <h4 class="mb-3">{{ title }}</h4>

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Нэр</label>
      <input class="form-control" name="name" required value="{{ row.name if row else '' }}">
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-success" type="submit">Хадгалах</button>
      <a class="btn btn-secondary" href="{{ url_for('alban_index') }}">Буцах</a>
    </div>
  </form>
</div>
{% endblock %}
