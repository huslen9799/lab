<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab13</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">Нүүр</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('alban_index') }}">Албан тушаал</a>
      <a class="nav-link" href="{{ url_for('zereg_index') }}">Эрдмийн зэрэг</a>
      <a class="nav-link" href="{{ url_for('tenhim_index') }}">Тэнхим</a>
      <a class="nav-link" href="{{ url_for('mergejil_index') }}">Мэргэжил</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-warning">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<footer class="bg-dark text-white py-3 mt-5">
  <div class="container small">Copyright © 2020</div>
</footer>

</body>
</html>
