<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Movie App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background-color: #121212;
    color: #f0f0f0;
}
.card {
    background-color: #363636;
    border: none;
}
.card-title {
    color: #7d3de6;
}
.form-control {
    background-color: #2a2a2a;
    color: #f0f0f0;
    border: 1px solid #444;
}
.form-control::placeholder {
    color: #bbb;
}
.btn-primary {
    background-color: #7d3de6;
    border-color: #7d3de6;
}
.btn-primary:hover {
    background-color: #3e1357;
    border-color: #3e1357;
}
a {
    color: #7d3de6;
}
a:hover {
    color: #3e1357;
}
.alert-danger {
    background-color: #7d3de6;
    border-color: #3e1357;
    color: #fff;
}
.txt{
  color: #fff;
}
</style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center" style="margin-top:100px;">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Нэвтрэх</h4>
          <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
              <input type="text" name="username" class="form-control" placeholder="Хэрэглэгчийн нэр" required>
            </div>
            <div class="mb-3">
              <input type="password" name="password" class="form-control" placeholder="Нууц үг" required>
            </div>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Нэвтрэх</button>
            </div>
          </form>
          <p class="mt-3 text-center">
           <a href="{{ url_for('register') }}" >Бүртгүүлэх</a>

          </p>
         <p><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>


        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
