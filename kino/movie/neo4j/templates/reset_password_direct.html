<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Нууц үг солих</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
/* Body & font */
body {
    background-color: #121212;
    color: #f0f0f0;
    font-family: 'Segoe UI', sans-serif;
}

/* Card */
.card {
    background-color: #363636;
    border: none;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Card title */
.card-title, h4 {
    color: #7d3de6;
    font-weight: 600;
}

/* Form controls */
.form-control {
    background-color: #2a2a2a;
    color: #f0f0f0;
    border: 1px solid #444;
    border-radius: 6px;
}
.form-control::placeholder {
    color: #bbb;
}

/* Buttons */
.btn-primary, .btn-success {
    background-color: #7d3de6;
    border-color: #7d3de6;
    color: #fff;
    transition: 0.3s;
}
.btn-primary:hover, .btn-success:hover {
    background-color: #3e1357;
    border-color: #3e1357;
}

.btn-outline-primary {
    color: #7d3de6;
    border-color: #7d3de6;
    transition: 0.3s;
}
.btn-outline-primary:hover {
    background-color: #7d3de6;
    color: #fff;
}

.btn-link {
    color: #7d3de6;
    text-decoration: none;
}
.btn-link:hover {
    color: #3e1357;
    text-decoration: underline;
}

/* Alerts */
.alert-danger {
    background-color: #7d3de6;
    border-color: #3e1357;
    color: #fff;
    border-radius: 6px;
    padding: 10px 15px;
}

.text-success {
    color: #7d3de6 !important;
}

.text-danger {
    color: #f44336 !important;
}

/* Links inside text */
a {
    color: #7d3de6;
}
a:hover {
    color: #3e1357;
}
</style>

<body class="bg-dark">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">

            <h4 class="text-center mb-3">{{ username }} — Нууц үг солих</h4>

            <form method="POST">
                <div class="mb-3">  
                    <label class="form-label">Шинэ нууц үг</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Давтан оруулах</label>
                    <input type="password" name="confirm" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Солих</button>

                <a href="{{ url_for('login') }}" class="btn btn-link w-100 mt-2">← Буцах (Нэвтрэх)</a>
            </form>

            {% if success %}
            <p class="text-success text-center mt-3">{{ success }}</p>
            {% endif %}

            {% if error %}
            <p class="text-danger text-center mt-3">{{ error }}</p>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
