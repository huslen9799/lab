<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Нууц үг сэргээх</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
/* Body & background */
body {
    background-color: #121212;
    color: #f0f0f0;
    font-family: 'Segoe UI', sans-serif;
}

/* Card */
.card {
    background-color: #363636;
    border: none;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

/* Card title */
.card-title, .card h4 {
    color: #7d3de6;
}

/* Form controls */
.form-control {
    background-color: #2a2a2a;
    color: #f0f0f0;
    border: 1px solid #444;
    border-radius: 6px;
}
.form-control::placeholder {
    color: #bbb;
}

/* Buttons */
.btn-primary {
    background-color: #7d3de6;
    border-color: #7d3de6;
}
.btn-primary:hover {
    background-color: #3e1357;
    border-color: #3e1357;
}

.btn-outline-primary {
    color: #7d3de6;
    border-color: #7d3de6;
}
.btn-outline-primary:hover {
    background-color: #7d3de6;
    color: #fff;
}

/* Links */
a {
    color: #7d3de6;
    text-decoration: none;
}
a:hover {
    color: #3e1357;
    text-decoration: underline;
}

/* Alerts */
.alert-danger {
    background-color: #7d3de6;
    border-color: #3e1357;
    color: #fff;
    border-radius: 6px;
    padding: 10px 15px;
}

/* Text */
.txt, p {
    color: #f0f0f0;
}
</style>

<body class="bg-dark">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Нууц үг сэргээх</h4>
          <form method="POST">
            <div class="mb-3">
              <input type="text" name="username" class="form-control" placeholder="Хэрэглэгчийн нэр" required>
            </div>
            <div class="d-grid mb-2">
              <button type="submit" class="btn btn-primary">Үргэлжлүүлэх</button>
            </div>
            <div class="d-grid">
              <a href="{{ url_for('login') }}" class="btn btn-outline-primary">Нэвтрэх</a>
            </div>
          </form>
          {% if error %}
          <div class="alert alert-danger mt-3">{{ error }}</div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>

</div>

</body>
</html>
