<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Нууц үг сэргээх</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h4 class="text-center mb-3">Нууц үг сэргээх</h4>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Хэрэглэгчийн нэр</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Үргэлжлүүлэх</button>

                <a href="{{ url_for('login') }}" class="btn btn-outline-primary w-100 mt-2">
    Нэвтрэх
</a>

            </form>

            {% if error %}
            <p class="text-danger text-center mt-3">{{ error }}</p>
            {% endif %}
        </div>
    </div>
</div>

</body>
</html>
