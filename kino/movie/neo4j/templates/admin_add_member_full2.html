<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кино баг нэмэх | {{ movie.title }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
<style>
body { background-color:#121212; color:#f0f0f0; padding:20px; }
.list-group-item { background-color:#2a2a2a; color:#f0f0f0; cursor:pointer; }
#add-form { display:none; margin-top:10px; }
</style>
</head>
<body>
<h3>Кино баг нэмэх: {{ movie.title }}</h3>

<label>Жүжигчдийн нэр хайх:</label>
<input type="text" id="person-search" class="form-control" placeholder="Жүжигчний нэр бичнэ үү..." autocomplete="off">
<div id="results" class="list-group mt-2"></div>

<form id="add-form" method="POST" class="mt-3">
    <input type="hidden" name="person" id="selected-person">
    <label>Роль сонгох:</label>
    <select name="role" class="form-control">
        <option value="ACTED_IN">Жүжигчин</option>
        <option value="DIRECTED">Найруулагч</option>
        <option value="WROTE">Зохиолч</option>
        <option value="PRODUCED">Продюсер</option>
    </select>
    <button class="btn btn-primary mt-3">Нэмэх</button>
</form>
<script>
const resultsDiv = document.getElementById("results");
const addForm = document.getElementById("add-form");
const personInput = document.getElementById("person-search");
const selectedPerson = document.getElementById("selected-person");

personInput.addEventListener("input", function () {
    const q = this.value.trim();
    resultsDiv.innerHTML = "";
    addForm.style.display = "none";
    selectedPerson.value = "";

    if (!q) return;

    fetch(`/search_person?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(data => {
            if (!data.results || data.results.length === 0) return;
            let html = "";
            data.results.forEach(name => {
                html += `<button type="button" class="list-group-item person-item">${name}</button>`;
            });
            resultsDiv.innerHTML = html;

            document.querySelectorAll(".person-item").forEach(btn => {
                btn.onclick = () => {
                    const personName = btn.innerText.trim();
                    if (!personName) return;
                    personInput.value = personName;
                    selectedPerson.value = personName; // ✅ Заавал утга онооно
                    resultsDiv.innerHTML = "";
                    addForm.style.display = "block";
                };
            });
        });
});
const formData = new FormData();
formData.append("person", person);
formData.append("role", role);
formData.append("movie_title", movieTitle);

fetch("/add_member_quick", {
    method: 'POST',
    body: formData
})


addForm.addEventListener("submit", function(e){
    e.preventDefault();
    const person = selectedPerson.value.trim();
    const role = this.role.value;
    const movieTitle = "{{ movie.title }}";

    if (!person) {
        alert("Алдаа гарлаа: Жүжигчний нэрийг сонгоно уу!");
        return;
    }

    const formData = new FormData();
    formData.append("person", person);
    formData.append("role", role);
    formData.append("movie_title", movieTitle);

    fetch("/add_member_quick", {
        method: 'POST',
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if(data.success){
            alert(data.message);
            addForm.reset();
            addForm.style.display = "none";
            selectedPerson.value = "";
        } else {
            alert(data.message);
        }
    })
    .catch(() => alert("Алдаа гарлаа, дахин оролдоно уу!"));
});
</script>

</body>
</html>
