<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends "base.html" %}
{% block content %}
<h2>Кинонууд</h2>
<div class="row">
    {% for movie in movies %}
    <div class="col-md-3">
        <div class="card mb-3">
            <img src="{{ url_for('static', filename='movies/' + (movie.image or 'default.jpg')) }}" class="card-img-top">
            <div class="card-body">
                <h5 class="card-title">{{ movie.title }}</h5>
                <p>Он: {{ movie.year }}</p>
                <a href="{{ url_for('movie_detail', title=movie.title) }}" class="btn btn-primary">Дэлгэрэнгүй</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}

</body>
</html>
