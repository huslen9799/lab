<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Movie App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* Body */
body {
    background-color: #121212;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Card */
.card {
    background-color: #1b1b1b;
    border: 1px solid #444;
    border-radius: 10px;
}

/* Card Title */
.card-title {
    color: #ff4d4d;
    font-weight: bold;
}

/* Inputs */
.form-control {
    background-color: #2a2a2a;
    color: #ffffff;
    border: 1px solid #ff4d4d;
    border-radius: 6px;
}
.form-control::placeholder {
    color: #ff9999;
}
.form-control:focus {
    background-color: #2a2a2a;
    border-color: #e60000;
    color: #ffffff;
    box-shadow: 0 0 0 0.2rem rgba(255,77,77,0.25);
}

/* Buttons */
.btn-success {
    background-color: #ff4d4d;
    border-color: #e60000;
    color: #fff;
    font-weight: bold;
}
.btn-success:hover {
    background-color: #e60000;
    border-color: #b80000;
}

/* Links */
a {
    color: #ff4d4d;
    text-decoration: none;
}
a:hover {
    color: #ff1a1a;
    text-decoration: underline;
}

/* Alert */
.alert-danger {
    background-color: #d43f3f;
    border-color: #b80000;
    color: #fff;
}

/* Text Center */
.text-center {
    color: #ffffff;
}
</style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center" style="margin-top:100px;">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Бүртгүүлэх</h4>
          <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
              <input type="text" name="username" class="form-control" placeholder="Хэрэглэгчийн нэр" required>
            </div>
            <div class="mb-3">
              <input type="password" name="password" class="form-control" placeholder="Нууц үг" required>
            </div>
            <div class="mb-3">
              <input type="password" name="confirm" class="form-control" placeholder="Нууц үг давтах" required>
            </div>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="d-grid">
              <button type="submit" class="btn btn-success">Бүртгүүлэх</button>
            </div>
          </form>
          <p class="mt-3 text-center">
            Аль хэдийн бүртгэлтэй юу? <a href="{{ url_for('login') }}">Нэвтрэх</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
