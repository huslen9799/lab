<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Movie App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
  <div class="row justify-content-center" style="margin-top:100px;">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title text-center mb-4">Бүртгүүлэх</h4>
          <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
              <input type="text" name="username" class="form-control" placeholder="Хэрэглэгчийн нэр" required>
            </div>
            <div class="mb-3">
              <input type="password" name="password" class="form-control" placeholder="Нууц үг" required>
            </div>
            <div class="mb-3">
              <input type="password" name="confirm" class="form-control" placeholder="Нууц үг давтах" required>
            </div>
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="d-grid">
              <button type="submit" class="btn btn-success">Бүртгүүлэх</button>
            </div>
          </form>
          <p class="mt-3 text-center">
            Аль хэдийн бүртгэлтэй юу? <a href="{{ url_for('login') }}">Нэвтрэх</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
