<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends "layout.html" %}
{% block content %}

<section class="section-pagetop bg-light">
    <div class="container">
        <h2 class="title-page">Продюсерууд</h2>
    </div>
</section>

<section class="section-content padding-y">
<div class="container">

    <div class="row">
        {% for producer in producers %}
        <div class="col-md-4 mb-4">
            <div class="card card-product-grid">
                <div class="img-wrap">
                    <img src="{{ url_for('static', filename='people/' + (producer.image or 'default_person.jpg')) }}">
                </div>
                <figcaption class="info-wrap">
                    <h5><a href="{{ url_for('person_detail', name=producer.name) }}">{{ producer.name }}</a></h5>
                    <p class="text-muted">Продюсер</p>

                    <hr>

                    <h6>Продюсер хийсэн кинонууд:</h6>
                    <ul>
                        {% for movie in producer.movies %}
                            <li><a href="{{ url_for('movie_detail', title=movie.title) }}">{{ movie.title }}</a></li>
                        {% endfor %}
                    </ul>

                </figcaption>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
</section>

{% endblock %}

</body>
</html>
