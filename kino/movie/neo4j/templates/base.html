<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie App{% endblock %}</title>
    
    <!-- Bootstrap & Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
    
    <style>
        /* Body & Typography */
        body {
            background-color: #1b1b1b; /* Хар фон */
            color: #ffffff; /* Цагаан текст */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        a {
            color: #ff4d4d;
            text-decoration: none;
        }

        a:hover {
            color: #ff1a1a;
        }

        /* Navbar */
        .navbar {
            background-color: #ff4d4d !important; /* Улаан navbar */
        }

        .navbar .nav-link {
            color: #ffffff !important;
        }

        .navbar .nav-link:hover {
            color: #000000 !important;
        }

        .navbar .nav-link.active {
            font-weight: bold;
        }

        /* Cards */
        .card, .card-product-grid {
            background-color: #2a2a2a; /* Хар фон карт */
            border: none;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }

        .card-product-grid:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 77, 77, 0.5);
        }

        /* Buttons */
        .btn-primary {
            background-color: #ff4d4d;
            border-color: #ff1a1a;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #ff1a1a;
            border-color: #ff0000;
            color: #fff;
        }

        /* Inputs */
        input, textarea, select {
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #ff4d4d;
            border-radius: 5px;
            padding: 6px 10px;
        }

        input::placeholder,
        textarea::placeholder {
            color: #ff9999;
        }

        /* Footer */
        footer {
            background-color: #1b1b1b;
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
            border-top: 1px solid #ff4d4d;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand text-light" href="{{ url_for('index') }}">Nomuka</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Кино</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('actors') }}">Жүжигчид</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('directors') }}">Найруулагч</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('writers') }}">Зохиолч</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('producers') }}">Продюсер</a></li>
        </ul>
        <ul class="navbar-nav">
            {% if session.get('username') %}
                <li class="nav-item"><span class="nav-link">{{ session['username'] }}</span></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Гарах</a></li>
            {% else %}
                <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Нэвтрэх</a></li>
            {% endif %}
        </ul>
    </div>
</nav>

<!-- Main content -->
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
