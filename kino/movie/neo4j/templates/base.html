<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Movie App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
    <style>
        body {
            background-color: #1b1b1b; /* хар фон */
            color: #f0f0f0; /* цагаан текст */
        }
        .navbar {
            background-color: #7d3de6 !important; /* улаан navbar */
        }
        .navbar .nav-link {
            color: #f0f0f0 !important;
        }
        .navbar .nav-link:hover {
            color: #000000 !important;
        }
        .card, .card-product-grid {
            background-color: #363636; /* картын хар фон */
            border: none;
        }
        .card, .card-product-grid:hover{
             transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(109, 86, 173, 0.5);
    transition: all 0.6s;
        }
        a {
            color: #7d3de6;
        }
        a:hover {
            color: #b04aeb;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <a class="navbar-brand text-light" href="{{ url_for('index') }}">HuslenTV</a>
    <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Кино</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('actors') }}">Жүжигчид</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('directors') }}">Найруулагч</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('writers') }}">Зохиолч</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('producers') }}">Продюсер</a></li>
        </ul>
        <ul class="navbar-nav">
            {% if session.get('username') %}
                <li class="nav-item"><span class="nav-link">{{ session['username'] }}</span></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('logout') }}">Logout</a></li>
            {% else %}
                <li class="nav-item"><a class="nav-link" href="{{ url_for('login') }}">Login</a></li>
            {% endif %}
        </ul>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}{% endblock %}
</div>

</body>
</html>
