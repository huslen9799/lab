<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Movie App</title>

<link href="{{ url_for('static', filename='css/bootstrap.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/ui.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet" media="only screen and (max-width:1200px)">
<link href="{{ url_for('static', filename='fonts/fontawesome/css/all.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='images/logo-section-4.svg') }}" rel="shortcut icon" type="image/x-icon">

<script src="{{ url_for('static', filename='js/jquery-2.0.0.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>

<!-- Navbar -->
<header class="section-header">
<section class="header-main border-bottom">
  <div class="container">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <img class="logo" src="{{ url_for('static', filename='images/neo4j_logo_globe.png') }}">
      </a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-item nav-link active" href="{{ url_for('index') }}">Нүүр</a>
          <a class="nav-item nav-link" href="#">Кино</a>
          <a class="nav-item nav-link" href="#">Жүжигчид</a>
          <a class="nav-item nav-link" href="#">Найруулагч</a>
          <a class="nav-item nav-link" href="#">Зохиолч</a>
          <a class="nav-item nav-link" href="#">Продюсер</a>
        </div>
      </div>
      <div class="ml-auto">
        {% if session.get('username') %}
          <span class="navbar-text text-light mr-3">Сайн байна уу, {{ session['username'] }}!</span>
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Гарах</a>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('login') }}">Нэвтрэх</a>
        {% endif %}
      </div>
    </nav>
  </div>
</section>
</header>

<!-- Main Content -->
<main role="main">
  {% block content %}
  {% endblock %}
</main>

<!-- Footer -->
<footer class="section-footer border-top padding-y">
  <div class="container">
    <p class="float-md-left">&copy; 2025 Movie App using Neo4j and Flask</p>
  </div>
</footer>

</body>
</html>
