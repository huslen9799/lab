
    <!DOCTYPE html>
    <html lang="en">

        <meta charset="UTF-8">

    <body>
   <!-- admin_add_movie.html -->
{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Кино нэмэх</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">Киноны нэр</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>

        <div class="mb-3">
            <label for="released" class="form-label">Нээлт хийсэн он</label>
            <input type="number" class="form-control" id="released" name="released" required>
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Киноны зураг</label>
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary">Нэмэх</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Буцах</a>
    </form>
</div>
{% endblock %}


    </body>
    </html>
