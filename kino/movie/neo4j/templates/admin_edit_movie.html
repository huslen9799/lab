<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   {% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Кино засах: {{ movie.title }}</h2>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="title" class="form-label">Кино нэр</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ movie.title }}" required>
        </div>

        <div class="mb-3">
            <label for="released" class="form-label">Он</label>
            <input type="number" class="form-control" id="released" name="released" value="{{ movie.released }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Одоогийн зураг</label><br>
            <img src="{{ url_for('static', filename='movies/' + (movie.image or 'default.jpg')) }}" alt="{{ movie.title }}" class="img-thumbnail mb-2" style="max-width:200px;">
        </div>

        <div class="mb-3">
            <label for="image" class="form-label">Шинэ зураг сонгох (заавал биш)</label>
            <input type="file" class="form-control" id="image" name="image" accept="image/*">
        </div>

        <button type="submit" class="btn btn-success">Хадгалах</button>
        <a href="{{ url_for('movie_detail', title=movie.title) }}" class="btn btn-secondary">Буцах</a>
    </form>
</div>
{% endblock %}



</body>
</html>
