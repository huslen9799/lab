<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>Ажилтан нэмэх</title>
</head>
<body>
    <h1>Ажилтан нэмэх</h1>
    <form method="POST">
        <label>Ажилтаны нэр: </label>
        <input type="text" name="wname" required><br><br>
        <label>Салбар: </label>
        <select name="bid">
            {% for branch in branches %}
            <option value="{{ branch.id }}">{{ branch.bname }}</option>
            {% endfor %}
        </select><br><br>
        <button type="submit">Нэмэх</button>
    </form>
    <a href="{{ url_for('index') }}">Буцах</a>
</body>
</html>
