<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ажилтан засах</title>
</head>
<body>

<h2>Ажилтан засах</h2>

<form method="POST">

    Нэр:
    <input type="text" name="wname" value="{{ worker.wname }}" required><br><br>

    Салбар:
    <select name="bid" required>
        {% for b in branches %}
            <option value="{{ b.id }}" {% if b.id == worker.bid %}selected{% endif %}>
                {{ b.bname }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <button type="submit">Хадгалах</button>
</form>

<br>
<a href="/">Буцах</a>

</body>
</html>
